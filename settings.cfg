# CribGuard Display Settings

# Baby Pi connection settings (where the IR camera is located)
baby_pi_ip=192.168.50.2
baby_pi_port=8000

# Camera stream port (UDP port for receiving RTP video)
camera_stream_port=5000

# Default audio record duration (seconds) for Baby Pi microphone
audio_record_seconds=30

# ALSA playback device for Baby Pi speakers (e.g. default, plughw:1,0, hw:0,0, hdmi:CARD=vc4hdmi0,DEV=0)
audio_play_device=plughw:1,0
